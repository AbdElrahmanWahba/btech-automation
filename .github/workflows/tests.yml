# ---------------------------------------------------------------------------
# CI pipeline — runs the B.tech Robot Framework suite automatically.
# ---------------------------------------------------------------------------
# Browser Library is Playwright-based, so CI must install BOTH the Python
# packages AND a real browser (Chromium) plus its Linux system libraries.
# ---------------------------------------------------------------------------
name: Robot Framework Tests

# Trigger the pipeline on every push and on every pull request.
on:
  push:
  pull_request:

jobs:
  ui-tests:
    name: B.tech UI test (Browser Library)
    runs-on: ubuntu-latest

    steps:
      # 1. Pull the repository source into the runner.
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Install Python 3.13. We pin 3.13 because a dependency (grpcio) has
      #    no prebuilt wheels for 3.14 yet. 'cache: pip' speeds up re-runs.
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      # 3. Install the Python dependencies (Robot Framework + Browser Library).
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Set up Browser Library's Node.js components WITHOUT downloading every
      #    browser binary — in CI we only need Chromium, not Firefox/WebKit.
      - name: Initialize Browser Library (skip browser binaries)
        run: rfbrowser init --skip-browsers

      # 5. Install Chromium plus the OS-level libraries Playwright needs on
      #    Ubuntu. '--with-deps' pulls those system packages automatically.
      - name: Install Chromium for Browser Library
        run: rfbrowser init --with-deps chromium

      # 6. Run the suite headless. STEP_PAUSE:0s disables the demo-only pauses
      #    so CI stays fast; all artifacts are written to the results/ folder.
      - name: Run Robot Framework tests
        run: robot --outputdir results -v HEADLESS:True -v STEP_PAUSE:0s tests/btech_purchase_flow.robot

      # 7. Always publish the Robot reports (report.html / log.html / output.xml)
      #    as a downloadable artifact — even when the test fails, so failures
      #    are debuggable straight from the Actions run.
      - name: Upload Robot Framework results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: results/
